name: Build debug APK

# Builds a debug APK on every push to main, and on demand from the
# Actions tab (workflow_dispatch). The sandbox/dev phone has no Android
# SDK, so this workflow IS the build machine for the testing phase.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit package list: the action's default list includes the
          # legacy "tools" package, which no longer exists in the SDK repo
          # and makes sdkmanager exit 1 (build failure 2026-10-24).
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: photolock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
